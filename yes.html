<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="yes.css" />
</head>

  <section class="slider-section">
  
    <div class="slider" id="imageSlider">
           <h3>choose one or let me know your ideas !!</h3>
     

      <div class="slides">
        <div class="slide active">
          <img src="images/bowl.jpg" alt="Bowling Show Off" />
          <div class="caption">
            <h2>Loser pays for food</h2>
            <p> I'd let you ROLL into my lane, wink wink </p>
          </div>
        </div>

        <div class="slide">
          <img src="images/pott.jpg" alt="Potter Painting Keepsake" />
          <div class="caption">
            <h2> We take each other's potts </h2>
            <p>Paint me like one of your french girls </p>
          </div>
        </div>

        <div class="slide">
          <img src="images/picnic.jpg" alt="Picnic with a twist" />
          <div class="caption">
            <h2> make ONE dish/snack of our own and judge each other's cooking </h2>
            <p> What is on the menu? Me-n-u, of course! </p>
          </div>
        </div>
      </div>

      <button class="slider-btn prev" id="prevBtn" aria-label="Previous slide">
        &#10094;
      </button>

      <button class="slider-btn next" id="nextBtn" aria-label="Next slide">
        &#10095;
      </button>

      <div class="dots" id="sliderDots" aria-label="Slider navigation"></div>

    </div>
  </section>

  <script src="script.js"></script>
